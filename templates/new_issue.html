<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Chat — NyaySetu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dm-surface-dark: #181715;
            --dm-surface-dark-elevated: #252320;
            --dm-surface-dark-soft: #1f1e1b;
            --dm-on-dark: #faf9f5;
            --dm-on-dark-soft: #a09d96;
            --dm-coral: #cc785c;
            --dm-coral-active: #a9583e;
            --dm-hairline-dark: rgba(255, 255, 255, .1);
            --font-serif: 'Cormorant Garamond', 'Tiempos Headline', Garamond, serif;
            --font-display: 'Space Grotesk', ui-sans-serif, system-ui;
            --font-body: 'Inter', ui-sans-serif, system-ui;
            --font-mono: 'IBM Plex Mono', ui-sans-serif, system-ui;
            --r-md: 16px;
            --r-lg: 22px;
            --r-full: 9999px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            background: var(--dm-surface-dark);
            color: var(--dm-on-dark);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* ===== top bar ===== */
        .chat-topbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid var(--dm-hairline-dark);
        }

        .chat-back {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--dm-on-dark-soft);
            padding: 8px 14px;
            border-radius: var(--r-full);
            border: 1px solid var(--dm-hairline-dark);
        }

        .chat-back:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .22);
        }

        .chat-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-brand .brand-icon {
            font-size: 18px;
        }

        .chat-brand .brand-text {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.2px;
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: .28px;
            text-transform: uppercase;
            color: var(--dm-on-dark-soft);
        }

        .chat-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dm-coral);
        }

        /* ===== main chat area ===== */
        .chat-main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }

        .chat-column {
            width: 100%;
            max-width: 760px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .chat-log {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 32px 4px 20px;
        }

        .chat-log::-webkit-scrollbar {
            width: 5px;
        }

        .chat-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .15);
            border-radius: 10px;
        }

        .bubble {
            border-radius: var(--r-md);
            padding: 16px 20px;
            font-size: 16px;
            line-height: 1.6;
            max-width: 80%;
        }

        .bubble.user {
            align-self: flex-end;
            background: var(--dm-surface-dark-elevated);
            border: 1px solid var(--dm-hairline-dark);
        }

        .bubble.ai {
            align-self: flex-start;
            background: rgba(204, 120, 92, .14);
            border-left: 2px solid var(--dm-coral);
            color: #fff;
            font-family: var(--font-serif);
            font-size: 19px;
            font-weight: 500;
        }

        .bubble.system {
            align-self: center;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .28px;
            text-transform: uppercase;
            color: var(--dm-on-dark-soft);
            background: none;
            padding: 2px 0;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-self: flex-start;
            padding: 14px 18px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dm-on-dark-soft);
            animation: blink 1.2s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: .25; }
            40% { opacity: 1; }
        }

        /* ===== Structured Dynamic Cards ===== */
        .structured-card {
            background: var(--dm-surface-dark-elevated);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-md);
            padding: 22px;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .sc-section {
            border-bottom: 1px solid var(--dm-hairline-dark);
            padding-bottom: 14px;
        }

        .sc-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sc-title {
            font-family: var(--font-display);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dm-coral);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sc-text {
            font-size: 15px;
            color: #f1efe9;
            line-height: 1.6;
        }

        /* Interactive Checklist Styling */
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
        }

        .checklist-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            cursor: pointer;
            margin-top: 3px;
            appearance: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .checklist-checkbox:checked {
            background: var(--dm-coral);
            border-color: var(--dm-coral);
        }

        .checklist-checkbox:checked::after {
            content: "✓";
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }

        .checklist-text {
            font-size: 14.5px;
            color: #dedede;
            line-height: 1.5;
            cursor: pointer;
            transition: color 0.15s;
        }

        .checklist-checkbox:checked + .checklist-text {
            text-decoration: line-through;
            color: var(--dm-on-dark-soft);
        }

        /* ===== Situation Risk Meter ===== */
        .risk-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-md);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .risk-label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--dm-on-dark-soft);
        }

        .risk-value {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
        }

        .risk-bar-track {
            width: 100%;
            height: 8px;
            border-radius: var(--r-full);
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .risk-bar-fill {
            height: 100%;
            border-radius: var(--r-full);
            width: 0%; /* Animated dynamically */
            transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-card {
            margin: 0 4px 16px;
            background: var(--dm-surface-dark-elevated);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-md);
            padding: 18px 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .result-card.show {
            display: flex;
        }

        .result-badge {
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .28px;
            text-transform: uppercase;
            background: var(--dm-coral);
            color: #fff;
            border-radius: var(--r-full);
            padding: 6px 12px;
            font-weight: 500;
        }

        .result-card p {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 500;
            color: #f1efe9;
            line-height: 1.5;
        }

        .attachment-tray {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 4px 12px;
        }

        .attachment-tray.show {
            display: flex;
        }

        .attachment-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--dm-surface-dark-elevated);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-full);
            padding: 6px 8px 6px 14px;
            font-size: 12.5px;
            color: #fff;
        }

        .attachment-chip .file-name {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attachment-chip .remove-file {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
        }

        .attachment-chip .remove-file:hover {
            background: var(--dm-coral);
        }

        /* ===== input dock ===== */
        .chat-input-dock {
            flex-shrink: 0;
            padding: 16px 4px 26px;
        }

        .console-input-row {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--dm-surface-dark-soft);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-full);
            padding: 8px 8px 8px 10px;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn:hover {
            background: rgba(255, 255, 255, .1);
        }

        .console-input-row input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-family: var(--font-body);
            font-size: 15px;
            min-width: 0;
        }

        .console-input-row input::placeholder {
            color: var(--dm-on-dark-soft);
        }

        .console-input-row input:focus {
            outline: none;
        }

        .send-btn {
            background: var(--dm-coral);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--dm-coral-active);
        }

        .send-btn:disabled {
            opacity: .5;
            cursor: default;
        }

        .chat-foot {
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--dm-on-dark-soft);
            text-align: center;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-picker {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--dm-hairline-dark);
            border-radius: var(--r-full);
            padding: 3px;
        }

        .lang-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--dm-on-dark-soft);
            padding: 4px 10px;
            border-radius: var(--r-full);
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--dm-coral);
            color: #ffffff;
        }

        @media (max-width:640px) {
            .chat-topbar {
                padding: 14px 16px;
            }

            .chat-back span.label {
                display: none;
            }

            .bubble {
                max-width: 92%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-topbar">
    <a href="/" class="chat-back">← <span class="label" data-i18n="back_link">Back to NyaySetu</span></a>
    <div class="chat-brand">
        <span class="brand-icon">⚖️</span>
        <span class="brand-text">NyaySetu Intake</span>
    </div>

    <div class="topbar-right">
        <div class="lang-picker" id="langPicker">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="hi">हिंदी</button>
            <button class="lang-btn" data-lang="mr">मराठी</button>
        </div>
        <span class="chat-status"><span class="chat-dot"></span> <span data-i18n="status_live">Live</span></span>
    </div>
    </div>

    <div class="chat-main">
        <div class="chat-column">
            <div class="chat-log" id="chatLog"></div>

            <div class="result-card" id="resultCard">
                <span class="result-badge" id="resultBadge">Category</span>
                <p id="resultText"></p>
            </div>

            <div class="attachment-tray" id="attachmentTray"></div>

            <div class="chat-input-dock">
                <div class="console-input-row">
                    <button class="attach-btn" id="attachBtn" type="button" aria-label="Attach a file">📎</button>
                    <!-- Strict PDF acceptance filter applied -->
                    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
                    <input type="text" id="chatInput" placeholder="Type your reply…" autocomplete="off" data-i18n-placeholder="input_placeholder">
                    <button class="send-btn" id="sendBtn" aria-label="Send message">➤</button>
                </div>
                <div class="chat-foot" data-i18n="chat_foot">Your description and files stay private and are never shared without your consent.</div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================================
        // Full-screen continuation of the NyaySetu intake chat. If the user typed
        // their first message on the landing page, it's handed off here via
        // sessionStorage (see index.html) and auto-sent on load.
        // ==========================================================================
        // 1. Language dictionary (place at the VERY TOP of <script>)
        const i18n = {
            en: {
                back_link: "Back to NyaySetu",
                status_live: "Live",
                input_placeholder: "Type your reply…",
                chat_foot: "Your description and files stay private and are never shared without your consent.",
                session_started: "Session started",
                welcome_ai: "Hi — I'm here to help you understand your legal situation. Go ahead and describe what happened, in your own words."
            },
            hi: {
                back_link: "न्यायसेतु पर वापस जाएं",
                status_live: "लाइव",
                input_placeholder: "अपनी समस्या या जवाब लिखें…",
                chat_foot: "आपका विवरण और फाइलें निजी रहती हैं और आपकी सहमति के बिना कभी साझा नहीं की जाती हैं।",
                session_started: "सत्र शुरू हुआ",
                welcome_ai: "नमस्ते — आपकी कानूनी स्थिति को समझने में मदद के लिए मैं यहाँ हूँ। अपनी समस्या अपने शब्दों में बताएं।"
            },
            mr: {
                back_link: "न्यायसेतूवर परत जा",
                status_live: "थेट",
                input_placeholder: "आपली समस्या किंवा उत्तर लिहा…",
                chat_foot: "आपली माहिती आणि कागदपत्रे खाजगी राहतात व तुमच्या संमतीशिवाय कधीही शेअर केली जात नाहीत.",
                session_started: "सत्र सुरू झाले",
                welcome_ai: "नमस्कार — तुमची कायदेशीर परिस्थिती समजून घेण्यास मदत करण्यासाठी मी इथे आहे. आपली समस्या तुमच्या शब्दांत सांगा."
            }
        };

        let currentLang = localStorage.getItem('nyaysetu_lang') || 'en';

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('nyaysetu_lang', lang);

            document.querySelectorAll('#langPicker .lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });

            const chatInputEl = document.getElementById('chatInput');
            if (chatInputEl && i18n[lang]) {
                chatInputEl.placeholder = i18n[lang].input_placeholder;
            }
        }
        
        let chatHistory = []; // [{ role: 'user'|'model', content }]

        async function getAIResponse(message) {
            const res = await fetch('/api/legal-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, history: chatHistory, language: currentLang })
            });
            if (!res.ok) throw new Error('Request failed: ' + res.status);
            return await res.json();
        }

        const chatLog = document.getElementById('chatLog');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const attachmentTray = document.getElementById('attachmentTray');
        const resultCard = document.getElementById('resultCard');
        const resultBadge = document.getElementById('resultBadge');
        const resultText = document.getElementById('resultText');

        let pendingFiles = [];

        function renderAttachmentTray() {
            attachmentTray.innerHTML = '';
            pendingFiles.forEach((file, i) => {
                const chip = document.createElement('div');
                chip.className = 'attachment-chip';
                chip.innerHTML = '<span>📄</span><span class="file-name"></span><span class="remove-file" role="button" aria-label="Remove file">✕</span>';
                chip.querySelector('.file-name').textContent = file.name;
                chip.querySelector('.remove-file').addEventListener('click', () => {
                    pendingFiles.splice(i, 1);
                    renderAttachmentTray();
                });
                attachmentTray.appendChild(chip);
            });
            attachmentTray.classList.toggle('show', pendingFiles.length > 0);
        }

        attachBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            fileInput.value = '';
            if (!file) return;

            const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
            if (!isPdf) {
                alert("Please attach a PDF file.");
                return;
            }

            pendingFiles.push(file);
            renderAttachmentTray();
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result).split(",")[1]);
                reader.onerror = () => reject(new Error("Could not read file"));
                reader.readAsDataURL(file);
            });
        }

        function addBubble(text, cls) {
            const div = document.createElement('div');
            div.className = 'bubble ' + cls;
            div.textContent = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
            return div;
        }

        async function handleSend(prefill) {
        let text = (typeof prefill === 'string' ? prefill : chatInput.value).trim();
        if (!text && pendingFiles.length === 0) return;

        // SAFEGUARD 1: If user attached a file but typed nothing, set a default prompt
        if (!text && pendingFiles.length > 0) {
          text = "Please analyze this attached document and guide me on what to do next based on its terms.";
        }

        // Display user messages in bubble
        addBubble(text, "user");
        pendingFiles.forEach((f) => addBubble("📎 " + f.name, "user"));
        
        const filesToSend = pendingFiles;
        pendingFiles = [];
        renderAttachmentTray();
        chatInput.value = "";
        sendBtn.disabled = true;

        const typing = document.createElement("div");
        typing.className = "typing-dots";
        typing.innerHTML = "<span></span><span></span><span></span>";
        chatLog.appendChild(typing);
        chatLog.scrollTop = chatLog.scrollHeight;

        try {
          // If a file was attached, process it in the background
          if (filesToSend.length > 0) {
            const attachedFile = filesToSend[0];
            const base64 = await fileToBase64(attachedFile);
            
            // Extract the document meaning
            const extractRes = await fetch("/api/analyze-document", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                file_name: attachedFile.name,
                mime_type: attachedFile.type || "application/pdf",
                file_base64: base64,
              }),
            });
            
            if (extractRes.ok) {
              const docData = await extractRes.json();
              // Append document context secretly to the message payload
              text += `\n\n[System Attached Document Context: "${attachedFile.name}" Summary: "${docData.explanation}"]`;
            } else {
              // SAFEGUARD 2: Alert user if background document analysis fails
              typing.remove();
              addBubble(`⚠️ Could not process the attachment "${attachedFile.name}". Please ensure it is a valid, unencrypted PDF under 15MB and try again.`, "ai");
              sendBtn.disabled = false;
              return;
            }
          }

          // Call standard legal chat API
          const result = await getAIResponse(text);
          typing.remove();

          if (result.type === "answer") {
            const rawText = result.reply;
            const sections = rawText.split(/### \d+\.\s+/);

            if (sections.length >= 5) {
              const summaryText = sections[1].replace(/^[^\n]+\n/, "").trim();
              const nextStepsText = sections[2].replace(/^[^\n]+\n/, "").trim();
              const haveEnsureText = sections[3].replace(/^[^\n]+\n/, "").trim();
              const keepInMindText = sections[4].replace(/^[^\n]+\n/, "").trim();

              // Calculate Situation Risk from Case Strength (100 - Strength)
              const strength = result.strength || 40;
              const riskPercent = 100 - strength;
              
              let riskLabel = "Low Risk";
              let riskColor = "#0a7d5c"; // Green
              
              if (riskPercent >= 70) {
                riskLabel = "High Risk ⚠️";
                riskColor = "#b30000"; // Red
              } else if (riskPercent >= 40) {
                riskLabel = "Moderate Risk";
                riskColor = "#c98a1e"; // Amber
              }

              const card = document.createElement("div");
              card.className = "structured-card";

              // 1. Render Dynamic Situation Risk Meter
              card.innerHTML += `
                <div class="risk-section">
                  <div class="risk-header">
                    <span class="risk-label">Situation Risk Assessment</span>
                    <span class="risk-value" style="color: ${riskColor};">${riskLabel} (${riskPercent}%)</span>
                  </div>
                  <div class="risk-bar-track">
                    <div class="risk-bar-fill" id="riskFill-${chatHistory.length}" style="background: ${riskColor};"></div>
                  </div>
                </div>`;

              // 2. Render Summary of Situation
              card.innerHTML += `
                <div class="sc-section" style="margin-top: 10px;">
                  <div class="sc-title">🛡️ Summary of Your Situation</div>
                  <div class="sc-text">${summaryText}</div>
                </div>`;

              // 3. Render Actionable Next Steps Checklist
              const stepsList = nextStepsText.split(/\n-\s+/).filter(Boolean);
              let stepsHTML = `<div class="sc-section"><div class="sc-title">📋 Actionable Next Steps</div>`;
              stepsList.forEach((step, idx) => {
                const cleanedStep = step.replace(/^-/, "").trim();
                if (cleanedStep) {
                  stepsHTML += `
                    <div class="checklist-item">
                      <input type="checkbox" class="checklist-checkbox" id="step-${idx}">
                      <label class="checklist-text" for="step-${idx}">${cleanedStep}</label>
                    </div>`;
                }
              });
              stepsHTML += `</div>`;
              card.innerHTML += stepsHTML;

              // 4. Render What You Must Have & Ensure Checklist
              const evidenceList = haveEnsureText.split(/\n-\s+/).filter(Boolean);
              let evidenceHTML = `<div class="sc-section"><div class="sc-title">📂 What You Must Have & Ensure</div>`;
              evidenceList.forEach((item, idx) => {
                const cleanedItem = item.replace(/^-/, "").trim();
                if (cleanedItem) {
                  evidenceHTML += `
                    <div class="checklist-item">
                      <input type="checkbox" class="checklist-checkbox" id="evidence-${idx}">
                      <label class="checklist-text" for="evidence-${idx}">${cleanedItem}</label>
                    </div>`;
                }
              });
              evidenceHTML += `</div>`;
              card.innerHTML += evidenceHTML;

              // 5. Render Important Things to Keep in Mind
              card.innerHTML += `
                <div class="sc-section">
                  <div class="sc-title">💡 Important Things to Keep in Mind</div>
                  <div class="sc-text">${keepInMindText.replace(/\n/g, "<br>")}</div>
                </div>`;

              chatLog.appendChild(card);
              
              // Animate the risk bar fill after rendering
              setTimeout(() => {
                const fillBar = document.getElementById(`riskFill-${chatHistory.length}`);
                if (fillBar) fillBar.style.width = riskPercent + "%";
              }, 100);

              chatLog.scrollTop = chatLog.scrollHeight;
            } else {
              // Fallback
              addBubble(result.reply, "ai");
            }
          } else {
            // Conversational turn
            addBubble(result.reply, "ai");
          }

          // Keep history in sync
          if (text) chatHistory.push({ role: "user", content: text });
          chatHistory.push({ role: "model", content: result.reply });

          if (result.category) {
            resultBadge.textContent = result.category;
            let line = result.summary || "";
            if (result.strength !== null && result.strength !== undefined) {
              line += (line ? " " : "") + `(Case strength: ${result.strength}/100)`;
            }
            resultText.textContent = line;
            resultCard.classList.add("show");
          }
        } catch (err) {
          typing.remove();
          addBubble(
            "Something went wrong reaching the AI: " + err.message,
            "ai",
          );
        } finally {
          sendBtn.disabled = false;
        }
      }

        document.querySelectorAll('#langPicker .lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyLanguage(btn.getAttribute('data-lang'));
            });
        });

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

        // ---- bootstrap: pick up the handed-off first message, or show a welcome ----
        (function bootstrap() {
            applyLanguage(currentLang);
            let initialMessage = null;
            try { initialMessage = sessionStorage.getItem('nyaysetu_initial_message'); } catch (e) { }

            if (initialMessage) {
                try { sessionStorage.removeItem('nyaysetu_initial_message'); } catch (e) { }
                const sys = addBubble(i18n[currentLang].session_started, 'system');
                sys.setAttribute('data-i18n', 'session_started');
                handleSend(initialMessage);
            } else {
                const sys = addBubble(i18n[currentLang].session_started, 'system');
                sys.setAttribute('data-i18n', 'session_started');
                
                const welcome = addBubble(i18n[currentLang].welcome_ai, 'ai');
                welcome.setAttribute('data-i18n', 'welcome_ai');
            }
            chatInput.focus();
        })();

    </script>
</body>

</html>
