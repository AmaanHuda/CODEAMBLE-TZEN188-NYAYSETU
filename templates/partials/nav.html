<!-- ================= NAV STYLES ================= -->
<style>
    .site-nav {
        position: sticky;
        top: 0;
        z-index: 300;
        background: rgba(251, 252, 251, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .site-nav.scrolled {
        border-bottom-color: var(--border, #e5e7eb);
        box-shadow: 0 2px 12px rgba(7, 22, 19, 0.04);
    }

    .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 32px;
        max-width: var(--container, 1220px);
        margin: 0 auto;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
    }

    .brand-icon {
        font-size: 22px;
    }

    .logo {
        height: 34px;
        width: auto;
    }

    .brand-text {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.3px;
        color: var(--ink, #17171c);
    }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 18px;
        border-radius: var(--radius-full, 9999px);
        white-space: nowrap;
    }

    .btn-outline {
        background: #fff;
        color: var(--ink, #17171c);
        border: 1px solid var(--border, #e5e7eb);
    }

    .btn-outline:hover {
        background: var(--bg-soft, #f5f5f5);
    }

    .btn-primary {
        background: var(--ink, #17171c);
        color: #fff;
        border: 1px solid var(--ink, #17171c);
    }

    .btn-primary:hover {
        background: #000;
    }

    /* ---- Account dropdown ---- */
    .account-area {
        position: relative;
    }

    .account-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border, #e5e7eb);
        border-radius: var(--radius-md, 10px);
        padding: 6px 12px 6px 6px;
        background: #fff;
        cursor: pointer;
    }

    .account-toggle:hover {
        background: var(--bg-soft, #f5f5f5);
    }

    .account-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent, #ff7759);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .account-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink, #17171c);
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .account-caret {
        font-size: 9px;
        color: var(--stone, #93939f);
        transition: transform 0.18s ease;
    }

    .account-area.open .account-caret {
        transform: rotate(180deg);
    }

    .account-menu {
        margin-top: 8px;
        border: 1px solid var(--border, #e5e7eb);
        border-radius: var(--radius-md, 10px);
        overflow: hidden;
        display: none;
        position: absolute;
        right: 0;
        background: #fff;
        width: 170px;
        z-index: 350;
        box-shadow: var(--shadow-lg, 0 12px 28px rgba(0, 0, 0, .12));
    }

    .account-menu.open {
        display: block;
    }

    .account-menu li a {
        display: block;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--ink, #17171c);
    }

    .account-menu li a:hover {
        background: var(--bg-soft, #f5f5f5);
    }

    .account-menu li.divider {
        border-top: 1px solid var(--border, #e5e7eb);
    }

    .account-menu li a.danger {
        color: #b3261e;
    }

    @media (max-width: 480px) {
        .nav-inner {
            padding: 12px 16px;
        }

        .account-name {
            display: none;
        }

        .account-toggle {
            padding: 6px;
        }

        .btn {
            padding: 8px 14px;
            font-size: 13px;
        }
    }
</style>

<!-- ================= NAV ================= -->
<nav class="site-nav" id="siteNav">
    <div class="nav-inner">
        <a href="/" class="brand">
            <span class="brand-text">NyaySetu</span>
        </a>

        <div class="nav-right">
            {% if user %}
            {% if request.path.startswith('/dashboard') %}
            <a href="/" class="btn btn-outline">Home</a>
            {% else %}
            <a href="/dashboard" class="btn btn-outline">Dashboard</a>
            {% endif %}
            <div class="account-area" id="accountArea">
                <button class="account-toggle" id="accountToggle" aria-haspopup="true" aria-expanded="false">
                    <span class="account-avatar">{{ user.initial or (user.name[0] | upper if user.name else 'U') }}</span>
                    <span class="account-name">{{ user.first_name or user.name }}</span>
                    <span class="account-caret">▾</span>
                </button>
                <ul class="account-menu" id="accountMenu">
                    <li><a href="/logout" class="danger">Logout</a></li>
                </ul>
            </div>
            {% else %}
            <a href="/login" class="btn btn-outline">Log In</a>
            <a href="/login" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- ================= NAV SCRIPT ================= -->
<script>
    // ---- Nav scroll shadow ----
    const siteNav = document.getElementById('siteNav');
    if (siteNav) {
        window.addEventListener('scroll', () => {
            siteNav.classList.toggle('scrolled', window.scrollY > 8);
        }, { passive: true });
    }

    // ---- Account dropdown ----
    const accountArea = document.getElementById('accountArea');
    const accountToggle = document.getElementById('accountToggle');
    const accountMenu = document.getElementById('accountMenu');

    if (accountToggle && accountMenu) {
        accountToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = accountMenu.classList.toggle('open');
            accountArea.classList.toggle('open', isOpen);
            accountToggle.setAttribute('aria-expanded', String(isOpen));
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#accountArea')) {
                accountMenu.classList.remove('open');
                accountArea.classList.remove('open');
                accountToggle.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                accountMenu.classList.remove('open');
                accountArea.classList.remove('open');
                accountToggle.setAttribute('aria-expanded', 'false');
            }
        });
    }
</script>
